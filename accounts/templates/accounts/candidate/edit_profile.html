<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile - Job Finder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; color: #333; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); padding: 30px; }
        h1 { color: #667eea; margin-bottom: 25px; }
        label { font-weight: 600; color: #667eea; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 18px; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; text-decoration: none; background: #667eea; color: white; margin-top: 10px; }
        .btn:hover { background: #5568d3; }
    </style>
</head>
<body>
<div class="container">
    <h1>Edit Profile</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ user.username }}" readonly>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ user.email }}" readonly>

        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone" value="{{ candidate.phone }}">

        <label for="skills">Skills</label>
        <textarea id="skills" name="skills" rows="1">{{ candidate.skills }}</textarea>

        <label for="experience">Experience</label>
        <textarea id="experience" name="experience" rows="3">{{ candidate.experience }}</textarea>

        <label for="cover_letter">Cover Letter</label>
        <textarea id="cover_letter" name="cover_letter" rows="3">{{ candidate.cover_letter }}</textarea>

        <label for="resume">Resume (PDF, DOC, DOCX)</label>
        {% if candidate.candidate and candidate.resume %}
            <p>Current: <a href="{{ candidate.resume.url }}" target="_blank">View Resume</a></p>
        {% endif %}
        <input type="file" id="resume" name="resume">

        <button type="submit" class="btn">Save Changes</button>
        <a href="{% url 'candidate_profile' %}" class="btn" style="background:#6c757d;">Cancel</a>
    </form>
</div>
</body>
</html>
