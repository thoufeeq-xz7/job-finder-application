{% block content %}
<style>
    body {
        background: linear-gradient(120deg, #e0e7ff 0%, #f5f6fa 100%);
        min-height: 100vh;
    }
    .post-job-wrapper {
        max-width: 700px;
        margin: 48px auto;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 8px 32px rgba(102,126,234,0.13);
        padding: 40px 36px 32px 36px;
        position: relative;
        overflow: hidden;
    }
    .post-job-wrapper:before {
        content: '';
        position: absolute;
        top: -60px;
        right: -60px;
        width: 180px;
        height: 180px;
        background: linear-gradient(135deg, #667eea 60%, #764ba2 100%);
        opacity: 0.12;
        border-radius: 50%;
        z-index: 0;
    }
    .post-job-title {
        color: #4c51bf;
        margin-bottom: 30px;
        text-align: center;
        font-weight: 800;
        font-size: 2.1rem;
        letter-spacing: 1px;
        position: relative;
        z-index: 1;
    }
    .post-job-form {
        display: flex;
        flex-direction: column;
        gap: 22px;
        position: relative;
        z-index: 1;
    }
    .form-label {
        font-weight: 700;
        color: #4c51bf;
        margin-bottom: 7px;
        display: block;
        letter-spacing: 0.5px;
    }
    .form-input, .form-textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #c3c7e5;
        border-radius: 7px;
        font-size: 1.08rem;
        background: #f7f8fd;
        transition: border 0.2s;
        font-family: inherit;
    }
    .form-input:focus, .form-textarea:focus {
        border: 1.5px solid #667eea;
        outline: none;
        background: #fff;
    }
    .form-textarea {
        min-height: 110px;
        resize: vertical;
    }
    .form-row {
        display: flex;
        gap: 18px;
    }
    .form-row > .form-group {
        flex: 1;
    }
    .form-group {
        display: flex;
        flex-direction: column;
    }
    .btn-gradient {
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        border: none;
        padding: 12px 0;
        border-radius: 7px;
        font-size: 1.15rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s, box-shadow 0.2s;
        box-shadow: 0 2px 10px rgba(102,126,234,0.10);
        margin-top: 10px;
        letter-spacing: 0.5px;
    }
    .btn-gradient:hover {
        background: linear-gradient(90deg, #5568d3 0%, #764ba2 100%);
        box-shadow: 0 4px 16px rgba(102,126,234,0.13);
    }
    @media (max-width: 600px) {
        .post-job-wrapper {
            padding: 18px 6vw 18px 6vw;
        }
        .post-job-title {
            font-size: 1.3rem;
        }
        .form-row {
            flex-direction: column;
            gap: 0;
        }
    }
</style>
<div class="post-job-wrapper">
    <div class="post-job-title">Post a New Job</div>
    <form method="post" action="" enctype="multipart/form-data" class="post-job-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="title" class="form-label">Job Title</label>
            <input type="text" class="form-input" id="title" name="title" required placeholder="e.g. Software Engineer">
        </div>
        <div class="form-group">
            <label for="description" class="form-label">Job Description</label>
            <textarea class="form-textarea" id="description" name="description" rows="6" required placeholder="Describe the job responsibilities, expectations, and more..."></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="location" class="form-label">Location</label>
                <input type="text" class="form-input" id="location" name="location" placeholder="e.g. Remote, New York, etc.">
            </div>
            <div class="form-group">
                <label for="salary" class="form-label">Salary <span style="color:#888;font-weight:400;">(optional)</span></label>
                <input type="text" class="form-input" id="salary" name="salary" placeholder="e.g. $60,000 - $80,000">
            </div>
        </div>
        <div class="form-group">
            <label for="requirements" class="form-label">Requirements <span style="color:#888;font-weight:400;">(optional)</span></label>
            <textarea class="form-textarea" id="requirements" name="requirements" rows="3" placeholder="List required skills, experience, etc."></textarea>
        </div>
        <button type="submit" class="btn-gradient">Post Job</button>
    </form>
</div>
{% endblock %}
